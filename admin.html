/* Admin workspace redesign */
:root{--navy:#10233f;--navy2:#17385f;--ink:#18263b;--muted:#718096;--line:#e7edf5;--canvas:#f5f7fb;--accent:#2864b4}

.admin-shell{min-height:100vh;display:grid;grid-template-columns:258px minmax(0,1fr)}.admin-sidebar{background:linear-gradient(180deg,#10233f,#132d4f);color:#eaf1fb;padding:22px 15px;display:flex;flex-direction:column;min-height:100vh;position:sticky;top:0;height:100vh;box-sizing:border-box;overflow:auto}

.admin-nav{padding:10px 0;flex:1}.nav-group{margin:9px 0 15px}.nav-group>small{display:block;padding:7px 10px;color:#8ea6c5;font-size:10px;text-transform:uppercase;letter-spacing:1.3px;font-weight:800}.nav-item{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;color:#c7d5e7;text-align:left;border-radius:9px;padding:10px 11px;margin:2px 0;font-size:12px;font-weight:650;cursor:pointer}.nav-item:hover{background:#ffffff12;color:#fff}.nav-item.active{background:#2d5f99;color:#fff;box-shadow:inset 3px 0 #8dc1ff}.nav-item i{font-style:normal;background:#d84b55;color:white;border-radius:20px;padding:2px 7px;font-size:10px}.sidebar-foot{border-top:1px solid #ffffff20;padding:13px 8px 0;display:grid;gap:9px}.sidebar-foot small{font-size:10px;color:#9eb2cc}.sidebar-foot a,.sidebar-foot button{color:#dce9f8;text-decoration:none;background:transparent;border:0;text-align:left;font-size:12px;padding:5px 0;cursor:pointer}
.admin-main{min-width:0}.admin-topbar{display:flex;justify-content:space-between;align-items:center;gap:15px;padding:24px 30px;background:#fff;border-bottom:1px solid var(--line)}.admin-topbar>div:first-child>small{font-size:10px;letter-spacing:1.4px;color:#8a98aa;font-weight:800}.admin-topbar h1{font-size:23px;margin:6px 0 0;color:#172b49}.top-actions{display:flex;align-items:center;gap:10px}.live-indicator,.secure-pill{font-size:11px;color:#16805a;background:#eaf8f1;border:1px solid #d3f0e1;border-radius:30px;padding:8px 11px}.admin-content{padding:22px 30px 40px;max-width:1600px;margin:auto}.admin-content .box{margin:0 0 16px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;box-shadow:0 4px 16px #10233f08}.admin-content .stats{margin-bottom:16px;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}.admin-content .stat{border:1px solid var(--line);border-radius:12px;padding:16px;background:#fff;box-shadow:0 3px 12px #10233f06}.admin-content .stat b{font-size:21px;color:#1d4778}.admin-content .tbl{border:1px solid var(--line);border-radius:10px}.admin-content .tbl th{background:#f3f6fa;color:#52647d;font-size:11px;text-transform:uppercase;letter-spacing:.3px}.admin-content .tbl td{font-size:12px;color:#33445c}.admin-content label{font-size:12px;font-weight:700;color:#43546b}.admin-content input:not([type=checkbox]):not([type=file]),.admin-content select,.admin-content textarea{border:1px solid #dce4ef;border-radius:8px;padding:10px;background:#fbfcfe}.admin-content button{cursor:pointer}.admin-content .primary-btn{background:#245b99;color:white;border:0}.admin-content .sm{border:1px solid #d8e2ee;border-radius:8px;background:#fff;color:#2b4d75;padding:8px 11px;font-size:11px;font-weight:700}.admin-content .fine-print{color:#78879b}.quick-panel{display:grid;grid-template-columns:220px minmax(0,1fr);gap:18px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:20px;margin-bottom:16px}.eyebrow{font-size:10px; @media(max-width:650px){.admin-shell{display:block}.admin-sidebar{position:relative;top:auto;height:auto;min-height:0;padding:12px}.brand{padding:3px 6px 11px}.profile-chip{padding:10px 6px}.admin-nav{display:flex;gap:12px;overflow-x:auto;padding:8px 0 3px}.nav-group{display:flex;align-items:center;gap:5px;margin:0;flex:0 0 auto}.nav-group>small{display:none}.nav-item{width:auto;white-space:nowrap;padding:9px 11px}.sidebar-foot{display:flex;align-items:center;justify-content:space-between;padding:9px 5px 0}.admin-topbar{padding:15px;align-items:flex-start}.admin-topbar h1{font-size:19px}.live-indicator{display:none}.admin-content{padding:12px}.permission-grid{grid-template-columns:1fr 1fr}.permission-card{padding:13px}.permission-card p{min-height:75px}.access-intro{align-items:flex-start;flex-direction:column}}
