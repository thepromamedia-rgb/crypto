<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>Crypto Bridge Admin</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    .adm{max-width:1080px;margin:20px auto;padding:0 18px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
    .tabs button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 13px;font-weight:800;cursor:pointer;color:var(--navy)}
    .tabs button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
    .tabs .dot{background:#e16b78;color:#fff;border-radius:99px;font-size:10px;padding:1px 6px;margin-left:5px}
    .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
    .stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px}.stat small{color:var(--muted);display:block;font-size:11px}.stat b{font-size:20px}
    .tbl{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:auto}
    table{border-collapse:collapse;width:100%;font-size:12px}th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{color:var(--muted);font-size:11px}
    .sm{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 9px;font-weight:800;font-size:11px;cursor:pointer;margin-right:4px}
    .sm.ok{background:#e4f8ee;color:#16805a;border-color:#bfe9d4}.sm.no{background:#fde8ea;color:#c0392b;border-color:#f5c2c8}
    .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:12px}
    .box label{display:block;font-size:12px;font-weight:800;margin:10px 0 6px}.box input,.box textarea{width:100%;border:1px solid #dce3f0;border-radius:10px;padding:11px;font:inherit}
    .login{max-width:380px;margin:60px auto}
  </style>
</head>
<body>
<div class="adm" id="root"></div>
<div class="toast" id="toast" role="status" hidden></div>
<script src="/admin.js" defer></script>
</body>
</html>
