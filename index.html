<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Coin Flip Visual Demo</title><link rel="stylesheet" href="coin-flip.css"></head><body style="margin:0;background:#101827;color:#fff;font-family:system-ui;padding:32px"><main style="max-width:460px;margin:auto"><h2>Coin Flip UI Demo</h2><p>Demo only — plug in your existing backend result and deadline.</p><div id="coin-game"></div><div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap"><button id="heads">Simulate backend: Heads</button><button id="tails">Simulate backend: Tails</button><button id="pending">Simulate pending result</button></div></main><script src="coin-flip.js"></script><script>const game=CoinFlipVisual.create(document.getElementById('coin-game'));let round=0;function start(result){game.updateRound({roundId:String(++round),deadlineMs:Date.now()+5000,result});}document.getElementById('heads').onclick=()=>start('heads');document.getElementById('tails').onclick=()=>start('tails');document.getElementById('pending').onclick=()=>start(null);start(null);</script></body></html>
