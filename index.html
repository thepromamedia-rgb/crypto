<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#142a54">
  <meta name="description" content="Crypto Bridge — live digital asset prices, wallet deposits and withdrawals.">
  <title>Crypto Bridge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button class="brand brand-button" data-page="Home" aria-label="Crypto Bridge home"><span class="brandmark">B</span><span><b>Crypto Bridge</b><small>Digital asset dashboard</small></span></button>
    <div class="topbar-right"><span class="demo-tag live"><i></i> LIVE PRICES</span><button class="language" id="account" type="button">Login</button></div>
  </header>
  <main id="appMain" tabindex="-1"></main>
  <nav class="bottom-nav" aria-label="Main navigation"><button class="active" data-page="Home"><span>⌂</span>Home</button><button data-page="Quotes"><span>⌁</span>Quotes</button><button data-page="Team"><span>♙</span>Team</button><button data-page="Bonus"><span>✦</span>Bonus</button><button data-page="Assets"><span>▣</span>Assets</button></nav>
  <div class="modal-backdrop" id="modal" hidden role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modal"><button class="close" id="closeModal" aria-label="Close dialog">×</button><div class="modal-symbol" id="modalSymbol">i</div><h2 id="modalTitle">Notice</h2><div id="modalBody"></div><button class="primary-btn" id="okModal" type="button">OK</button></div></div>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <footer id="siteFooter">India-focused platform</footer>
  <script src="app.js" defer></script>
</body>
</html>
